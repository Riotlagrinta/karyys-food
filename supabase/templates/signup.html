<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
</head>
<body style="font-family: sans-serif; background-color: #0D0A08; color: #F5EDE8; padding: 24px; text-align: center;">
  <div style="max-width: 480px; margin: 0 auto; background-color: #1A1410; border: 1px solid #5C3A1E; padding: 32px; border-radius: 12px;">
    <h2 style="color: #E8B4CC; font-family: 'serif'; margin-bottom: 24px;">Bienvenue chez Karyy's Food 🍽️</h2>
    <p style="color: #9B8B7D; font-size: 16px;">Merci pour votre inscription ! Pour valider votre compte, veuillez saisir le code de confirmation suivant dans l'application :</p>
    <div style="font-size: 32px; font-weight: bold; color: #C47FA0; background-color: #241C16; padding: 16px; border-radius: 8px; margin: 24px 0; letter-spacing: 4px; border: 1px dashed #C47FA0;">
      {{ .Token }}
    </div>
    <p style="color: #9B8B7D; font-size: 12px; margin-top: 24px;">Ce code de confirmation est à usage unique et expire dans 1 heure.</p>
  </div>
</body>
</html>
